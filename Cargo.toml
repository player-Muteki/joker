[workspace]
members = [
    "crates/joker",
    "crates/joker-config",
    "crates/joker-provider",
    "crates/joker-tools",
    "crates/joker-tui",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
futures-core = "0.3"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
schemars = "1"
unicode-width = "0.2"
url = "2"
