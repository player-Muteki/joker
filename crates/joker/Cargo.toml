[package]
name = "joker"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-core.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
