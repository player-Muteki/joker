name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build release
        run: cargo build --release --locked -p joker-tui --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/joker${{ matrix.suffix }} dist/
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: joker-${{ matrix.target }}
          path: dist/

  create-release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: joker-*
          merge-multiple: true
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: joker-*
          body: |
            See [CHANGELOG](CHANGELOG.md) for details.
